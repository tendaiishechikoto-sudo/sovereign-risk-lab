name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/ingest_manual.py
      - run: pytest tests/ -v
      - name: Phase two (football) - validate manual data
        working-directory: football
        run: python scripts/ingest_manual.py
      - name: Phase two (football) - tests
        working-directory: football
        run: pytest tests/ -v
