name: Deploy Pages

# Publishes the repo to GitHub Pages via Actions (not the classic "deploy
# from branch" method, which only supports /root or /docs — this repo's
# frontend lives in /frontend and reads ../data/processed/*.json, so the
# whole repo is published as-is and the dashboard is reached at
# https://<user>.github.io/<repo>/frontend/ — this preserves the exact
# relative paths already verified locally, no path rewriting needed.
#
# One-time setup required in the GitHub UI: Settings -> Pages -> Source:
# "GitHub Actions" (not "Deploy from a branch").

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
