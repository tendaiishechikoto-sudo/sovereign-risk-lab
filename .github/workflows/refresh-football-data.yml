name: Refresh football data

# Same pattern as refresh-data.yml, scoped to the phase-two pipeline in
# football/. Runs the World Bank comparator-context pull on a schedule and
# commits the refreshed football/data/processed/*.json. CIES/FIFA/press
# figures in football/raw/manual/*.csv are never touched by this workflow -
# they change only when a human re-researches and re-cites them (see
# football/raw/manual/README.md).
#
# football/data/processed/ ships empty in this repo, same reasoning as phase
# one: generated output that depends on a live World Bank pull is not checked
# in as a static snapshot pretending to be current. Run
# `python football/scripts/process.py` locally, or let this workflow do it.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run phase-two pipeline
        working-directory: football
        run: python scripts/process.py
      - name: Commit refreshed data if changed
        run: |
          git config user.name "sovereign-risk-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add football/data/processed/ football/raw/api_cache/
          git diff --cached --quiet || git commit -m "chore: refresh football phase-two data [automated]"
          git push
